<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Athena RAG — Research Intelligence Platform</title>
  <desc id="hero-desc">Upload research papers, ask questions, and get AI-powered answers with real source citations. Visual pipeline: PDF document, text chunks, vector search, LLM generation, cited answer with paper references.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#1A1714"/>
    </linearGradient>
    <linearGradient id="omega-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E08950"/>
      <stop offset="100%" stop-color="#B8943C"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4783C"/>
      <stop offset="100%" stop-color="#B8943C"/>
    </linearGradient>
    <linearGradient id="line-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4783C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4783C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrow-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4783C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B8943C" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="glow-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4783C" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#D4783C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)"/>

  <!-- Ambient glow -->
  <circle cx="160" cy="170" r="160" fill="url(#glow-amber)"/>

  <!-- Subtle structural grid -->
  <g stroke="#36302A" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="0" y1="56" x2="1200" y2="56"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="184" x2="1200" y2="184"/>
    <line x1="0" y1="248" x2="1200" y2="248"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="56" y1="0" x2="56" y2="380"/>
    <line x1="120" y1="0" x2="120" y2="380"/>
    <line x1="530" y1="0" x2="530" y2="380"/>
    <line x1="1144" y1="0" x2="1144" y2="380"/>
  </g>

  <!-- ===== LEFT: BRAND ===== -->

  <!-- Omega symbol -->
  <text x="56" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="url(#omega-grad)" font-weight="700">&#x03A9;</text>

  <!-- Athena name -->
  <text x="56" y="175" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#E6DCC3" font-weight="600" letter-spacing="-0.5">Athena</text>

  <!-- RAG badge -->
  <rect x="215" y="135" width="58" height="28" rx="7" fill="#D4783C" fill-opacity="0.15"/>
  <text x="222" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#D4783C" font-weight="700" letter-spacing="1.2">RAG</text>

  <!-- Tagline -->
  <text x="56" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#9F907E" font-weight="400">Upload. Search. Synthesize.</text>

  <!-- Divider -->
  <line x1="56" y1="258" x2="460" y2="258" stroke="url(#line-fade)" stroke-width="1"/>

  <!-- Tech pills -->
  <g transform="translate(56 278)">
    <rect x="0" y="0" width="78" height="28" rx="14" fill="#1E1B18" stroke="#36302A" stroke-width="1"/>
    <text x="12" y="19" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#B8943C">Next.js</text>

    <rect x="90" y="0" width="86" height="28" rx="14" fill="#1E1B18" stroke="#36302A" stroke-width="1"/>
    <text x="102" y="19" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#B8943C">TypeScript</text>

    <rect x="188" y="0" width="72" height="28" rx="14" fill="#1E1B18" stroke="#36302A" stroke-width="1"/>
    <text x="200" y="19" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#B8943C">Qdrant</text>

    <rect x="0" y="38" width="108" height="28" rx="14" fill="#1E1B18" stroke="#36302A" stroke-width="1"/>
    <text x="12" y="57" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#B8943C">PostgreSQL</text>

    <rect x="120" y="38" width="74" height="28" rx="14" fill="#1E1B18" stroke="#36302A" stroke-width="1"/>
    <text x="132" y="57" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#B8943C">Mistral</text>

    <rect x="206" y="38" width="70" height="28" rx="14" fill="#1E1B18" stroke="#36302A" stroke-width="1"/>
    <text x="218" y="57" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#B8943C">OpenAI</text>
  </g>

  <!-- ===== RIGHT: PIPELINE ===== -->

  <g transform="translate(560 48)">
    <!-- Card 1: Upload PDF -->
    <rect x="0" y="0" width="140" height="135" rx="10" fill="#1E1B18" stroke="#36302A" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="4" rx="2" fill="url(#accent-bar)"/>

    <!-- Document icon -->
    <g transform="translate(58 22)">
      <path d="M12 2H6a2 2 0 00-2 2v16a2 2 0 002 2h10a2 2 0 002-2V7.5L12 2z" fill="none" stroke="#D4783C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="12 2 12 8 18 8" fill="none" stroke="#D4783C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="8" y1="15" x2="14" y2="15" stroke="#D4783C" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
      <line x1="8" y1="19" x2="16" y2="19" stroke="#D4783C" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
    </g>

    <text x="70" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#E6DCC3" font-weight="600" text-anchor="middle">Upload PDF</text>
    <text x="70" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#9F907E" text-anchor="middle">Extract text</text>
    <text x="70" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#9F907E" text-anchor="middle">LLM metadata</text>

    <!-- Arrow 1 -->
    <line x1="152" y1="67" x2="186" y2="67" stroke="url(#arrow-grad)" stroke-width="1.5"/>
    <polygon points="184,61 194,67 184,73" fill="#D4783C" fill-opacity="0.45"/>

    <!-- Card 2: Chunk & Embed -->
    <rect x="200" y="0" width="140" height="135" rx="10" fill="#1E1B18" stroke="#36302A" stroke-width="1"/>
    <rect x="200" y="0" width="140" height="4" rx="2" fill="url(#accent-bar)"/>

    <!-- Embedding mesh icon (nodes connected by lines) -->
    <g transform="translate(258 26)">
      <circle cx="4" cy="4" r="3" fill="#D4783C" fill-opacity="0.7"/>
      <circle cx="18" cy="2" r="3" fill="#B8943C" fill-opacity="0.7"/>
      <circle cx="12" cy="16" r="3" fill="#D4783C" fill-opacity="0.5"/>
      <circle cx="2" cy="18" r="3" fill="#B8943C" fill-opacity="0.5"/>
      <line x1="4" y1="4" x2="18" y2="2" stroke="#D4783C" stroke-width="1" stroke-opacity="0.5"/>
      <line x1="4" y1="4" x2="12" y2="16" stroke="#D4783C" stroke-width="1" stroke-opacity="0.35"/>
      <line x1="18" y1="2" x2="12" y2="16" stroke="#B8943C" stroke-width="1" stroke-opacity="0.35"/>
      <line x1="4" y1="4" x2="2" y2="18" stroke="#D4783C" stroke-width="1" stroke-opacity="0.25"/>
      <line x1="18" y1="2" x2="2" y2="18" stroke="#B8943C" stroke-width="1" stroke-opacity="0.25"/>
      <line x1="12" y1="16" x2="2" y2="18" stroke="#D4783C" stroke-width="1" stroke-opacity="0.4"/>
    </g>

    <text x="270" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#E6DCC3" font-weight="600" text-anchor="middle">Chunk &amp; Embed</text>
    <text x="270" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#9F907E" text-anchor="middle">1K-token chunks</text>
    <text x="270" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#9F907E" text-anchor="middle">1024-dim vectors</text>

    <!-- Arrow 2 -->
    <line x1="352" y1="67" x2="386" y2="67" stroke="url(#arrow-grad)" stroke-width="1.5"/>
    <polygon points="384,61 394,67 384,73" fill="#D4783C" fill-opacity="0.45"/>

    <!-- Card 3: Search -->
    <rect x="400" y="0" width="140" height="135" rx="10" fill="#1E1B18" stroke="#36302A" stroke-width="1"/>
    <rect x="400" y="0" width="140" height="4" rx="2" fill="url(#accent-bar)"/>

    <!-- Search magnifying glass icon -->
    <g transform="translate(458 23)">
      <circle cx="8" cy="8" r="7" fill="none" stroke="#D4783C" stroke-width="1.5"/>
      <line x1="13" y1="13" x2="20" y2="20" stroke="#D4783C" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <text x="470" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#E6DCC3" font-weight="600" text-anchor="middle">Search</text>
    <text x="470" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#9F907E" text-anchor="middle">Cosine similarity</text>
    <text x="470" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#9F907E" text-anchor="middle">User isolation</text>

    <!-- Arrow 3 -->
    <line x1="552" y1="67" x2="586" y2="67" stroke="url(#arrow-grad)" stroke-width="1.5"/>
    <polygon points="584,61 594,67 584,73" fill="#D4783C" fill-opacity="0.45"/>

    <!-- Card 4: Cited Answer -->
    <rect x="600" y="0" width="140" height="135" rx="10" fill="#1E1B18" stroke="#36302A" stroke-width="1"/>
    <rect x="600" y="0" width="140" height="4" rx="2" fill="url(#accent-bar)"/>

    <!-- Sparkle/star icon -->
    <g transform="translate(658 23)">
      <polygon points="12,0 14.5,8.5 23,11 14.5,13.5 12,22 9.5,13.5 1,11 9.5,8.5" fill="none" stroke="#B8943C" stroke-width="1.2" stroke-linejoin="round"/>
    </g>

    <text x="670" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#E6DCC3" font-weight="600" text-anchor="middle">Cited Answer</text>
    <text x="670" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#9F907E" text-anchor="middle">Streaming LLM</text>
    <text x="670" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#9F907E" text-anchor="middle">Source attribution</text>
  </g>

  <!-- Bottom text -->
  <text x="56" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#9F907E" fill-opacity="0.4">Agentic RAG platform for academic research — production-grade, multi-tenant, vector-native</text>
</svg>
